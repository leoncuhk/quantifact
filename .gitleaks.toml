# quantifact treats a failing secret scan as a real signal, so the allowlist is
# narrow: content-addressed digests only, in the generated artefacts that are
# supposed to be full of them. A credential in any of these files would still be
# caught, because the allowlist matches the digest *field names*, not the files.
[extend]
useDefault = true

[allowlist]
description = "content-addressed digests are identifiers, not credentials"
regexTarget = "match"
regexes = [
  '''"(cache_key|content_hash|ast_digest|values_hash|fingerprint)"\s*:\s*"[0-9a-f]{8,64}"''',
  '''\b[0-9a-f]{16}\b''',
]
paths = [
  '''benchmarks/.*\.json''',
  '''site/data\.json''',
  '''site/blueprint\.html''',
]
