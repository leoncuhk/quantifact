name: Secret scan

on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: Install gitleaks
        run: |
          VERSION=8.24.3
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      # Scan the full history rather than a push diff: the action's default
      # range breaks on an initial push (there is no parent to diff against)
      # and, more importantly, a leak that entered three commits ago still
      # matters.
      - name: Scan history
        run: gitleaks detect --source . --redact --verbose --exit-code 1
      - name: Scan working tree
        run: gitleaks detect --source . --no-git --redact --verbose --exit-code 1
