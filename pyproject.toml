[project]
name = "quantifact"
version = "0.2.0"
description = "An investment-research agent that has to prove its numbers: plan as IR, contracts as gatekeepers, point-in-time by construction."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Leon" }]
keywords = ["llm", "llm-agents", "ai-agent", "investment-research",
            "investment-research-agent", "ai-analyst", "research-agent",
            "point-in-time", "look-ahead-bias", "survivorship-bias",
            "quantitative-finance", "financial-data", "data-contracts",
            "dataframe-validation", "pandas", "agentic-coding", "compiler",
            "reproducibility", "evals", "pocket-analyst"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.26", "pandas>=2.2", "pyarrow>=15"]

[project.optional-dependencies]
duckdb = [
    "duckdb>=1.0",
]

[project.urls]
Homepage = "https://github.com/leoncuhk/quantifact"
Documentation = "https://github.com/leoncuhk/quantifact/tree/main/docs"
Issues = "https://github.com/leoncuhk/quantifact/issues"

[project.scripts]
qf = "quantifact.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quantifact"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 90
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]
