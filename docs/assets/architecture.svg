<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Quantifact four-subsystem architecture</title>
  <desc id="desc">Four bounded subsystems turn a research question into reviewable evidence. Research understanding creates a typed research design, the analysis compiler generates and inspects code, controlled execution materialises verified results, and organisation learning converts audited failures into benchmark-gated changes. Permission-aware point-in-time data supports understanding and execution; models are replaceable backends rather than orchestrators.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset="1" stop-color="#101c32"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="13" flood-color="#020617" flood-opacity=".38"/>
    </filter>
    <marker id="arrow-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-learn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#c084fc"/>
    </marker>
    <style>
      .sans{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace}
      .eyebrow{font-size:12px;letter-spacing:1.7px;font-weight:700;fill:#94a3b8}
      .heading{font-size:24px;font-weight:750;fill:#f8fafc}
      .body{font-size:14px;fill:#cbd5e1}
      .small{font-size:12px;fill:#94a3b8}
      .box{fill:#111d31;stroke:#334155;stroke-width:1.5}
      .box-primary{fill:#102338;stroke:#38bdf8;stroke-width:1.8}
      .box-learning{fill:#1d1b38;stroke:#a78bfa;stroke-width:1.8}
      .chip{fill:#17243a;stroke:#334155;stroke-width:1}
      .flow{fill:none;stroke:#38bdf8;stroke-width:2.5;marker-end:url(#arrow-flow)}
      .data{fill:none;stroke:#94a3b8;stroke-width:1.8;stroke-dasharray:7 6;marker-end:url(#arrow-data)}
      .learn{fill:none;stroke:#c084fc;stroke-width:2.3;marker-end:url(#arrow-learn)}
    </style>
  </defs>

  <rect width="1440" height="900" rx="28" fill="url(#bg)"/>
  <circle cx="1320" cy="-40" r="270" fill="#2563eb" opacity=".07"/>
  <circle cx="60" cy="930" r="300" fill="#8b5cf6" opacity=".06"/>

  <text x="64" y="54" class="sans eyebrow">QUANTIFACT · FOUR BOUNDED SUBSYSTEMS</text>
  <text x="64" y="91" class="sans heading">Models propose; deterministic boundaries decide what may become evidence</text>

  <!-- External boundary: user and model -->
  <g filter="url(#shadow)">
    <rect x="64" y="127" width="1312" height="74" rx="14" fill="#0c1729" stroke="#26364d"/>
    <text x="88" y="154" class="sans eyebrow">HUMAN + MODEL BOUNDARY</text>
    <text x="88" y="180" class="sans body">Expert asks, reviews the plan, and approves lessons</text>
    <rect x="510" y="145" width="350" height="38" rx="19" class="chip"/>
    <text x="685" y="169" text-anchor="middle" class="mono" font-size="12" fill="#7dd3fc">replaceable model backends · no control authority</text>
    <text x="910" y="168" class="sans body">planner · codegen · optional critic/debugger</text>
  </g>

  <!-- Four subsystems -->
  <g filter="url(#shadow)">
    <rect x="64" y="250" width="286" height="274" rx="18" class="box-primary"/>
    <text x="88" y="282" class="sans eyebrow">01 · RESEARCH UNDERSTANDING</text>
    <text x="88" y="315" class="sans heading" font-size="21">Make the question</text>
    <text x="88" y="338" class="sans heading" font-size="21">admissible</text>
    <text x="88" y="365" class="sans body">clarify definitions and as_of</text>
    <text x="88" y="388" class="sans body">search permitted documents + series</text>
    <text x="88" y="411" class="sans body">bind workflow and concrete data IDs</text>
    <text x="88" y="434" class="sans body">pre-register claims, rivals, falsifiers</text>
    <rect x="88" y="451" width="238" height="48" rx="9" class="chip"/>
    <text x="207" y="472" text-anchor="middle" class="mono" font-size="11" fill="#5eead4">output: ResearchDesign</text>
    <text x="207" y="489" text-anchor="middle" class="mono" font-size="11" fill="#5eead4">+ bound AnalysisPlan</text>

    <rect x="390" y="250" width="286" height="274" rx="18" class="box"/>
    <text x="414" y="282" class="sans eyebrow">02 · ANALYSIS COMPILER</text>
    <text x="414" y="318" class="sans heading">Constrain implementation</text>
    <text x="414" y="349" class="sans body">compile typed plan / IR</text>
    <text x="414" y="372" class="sans body">generate one function per task</text>
    <text x="414" y="395" class="sans body">parallel codegen from schemas</text>
    <text x="414" y="418" class="sans body">AST inspect + derive actual DAG</text>
    <rect x="414" y="451" width="238" height="48" rx="9" class="chip"/>
    <text x="533" y="472" text-anchor="middle" class="mono" font-size="11" fill="#7dd3fc">output: checked functions</text>
    <text x="533" y="489" text-anchor="middle" class="mono" font-size="11" fill="#7dd3fc">+ dependency graph</text>

    <rect x="716" y="250" width="286" height="274" rx="18" class="box-primary"/>
    <text x="740" y="282" class="sans eyebrow">03 · CONTROLLED EXECUTION</text>
    <text x="740" y="318" class="sans heading">Materialise verified values</text>
    <text x="740" y="349" class="sans body">harness-owned execution</text>
    <text x="740" y="372" class="sans body">point-in-time-bound loaders</text>
    <text x="740" y="395" class="sans body">schema · invariant · reasoning gates</text>
    <text x="740" y="418" class="sans body">targeted repair + value cache</text>
    <rect x="740" y="451" width="238" height="48" rx="9" class="chip"/>
    <text x="859" y="472" text-anchor="middle" class="mono" font-size="11" fill="#5eead4">output: report + receipt</text>
    <text x="859" y="489" text-anchor="middle" class="mono" font-size="11" fill="#5eead4">or named failure</text>

    <rect x="1042" y="250" width="334" height="274" rx="18" class="box-learning"/>
    <text x="1066" y="282" class="sans eyebrow">04 · ORGANISATION LEARNING</text>
    <text x="1066" y="318" class="sans heading">Improve without silent drift</text>
    <text x="1066" y="349" class="sans body">capture expert correction / missed failure</text>
    <text x="1066" y="372" class="sans body">reproduce with a failing benchmark</text>
    <text x="1066" y="395" class="sans body">propose workflow / planner / gate change</text>
    <text x="1066" y="418" class="sans body">full regression + human approval</text>
    <rect x="1066" y="451" width="286" height="48" rx="9" fill="#292443" stroke="#5b4d83"/>
    <text x="1209" y="472" text-anchor="middle" class="mono" font-size="11" fill="#d8b4fe">output: versioned lesson + benchmark</text>
    <text x="1209" y="489" text-anchor="middle" class="mono" font-size="11" fill="#d8b4fe">never automatic merge</text>
  </g>

  <!-- Primary flow -->
  <path d="M350 387H382" class="flow"/>
  <path d="M676 387H708" class="flow"/>
  <path d="M1002 387H1034" class="learn"/>
  <text x="366" y="374" text-anchor="middle" class="sans small">typed IR</text>
  <text x="692" y="374" text-anchor="middle" class="sans small">code + DAG</text>
  <text x="1018" y="374" text-anchor="middle" class="sans small">audited failure</text>

  <!-- Data/tool substrate -->
  <g filter="url(#shadow)">
    <rect x="64" y="585" width="938" height="126" rx="16" fill="#0c1729" stroke="#334155" stroke-width="1.5"/>
    <text x="88" y="615" class="sans eyebrow">PERMISSION-AWARE, POINT-IN-TIME DATA + TOOL SUBSTRATE</text>
    <text x="88" y="648" class="sans heading">Adapters are the trust boundary</text>
    <text x="88" y="677" class="sans body">catalog metadata · numeric vintages · document citations · entitlements · invariants · fingerprints</text>
    <rect x="748" y="624" width="226" height="52" rx="10" class="chip"/>
    <text x="861" y="646" text-anchor="middle" class="mono" font-size="11" fill="#cbd5e1">read during search</text>
    <text x="861" y="665" text-anchor="middle" class="mono" font-size="11" fill="#cbd5e1">read again during execution</text>
  </g>
  <path d="M207 585V539Q207 531 215 531V524" class="data"/>
  <path d="M859 585V532Q859 524 859 524" class="data"/>

  <!-- Evidence package and learning return -->
  <g filter="url(#shadow)">
    <rect x="1042" y="585" width="334" height="126" rx="16" fill="#0d202e" stroke="url(#cyan)" stroke-width="1.7"/>
    <text x="1066" y="615" class="sans eyebrow">REVIEWABLE EVIDENCE PACKAGE</text>
    <text x="1066" y="648" class="sans heading">Claim → evidence → limits</text>
    <text x="1066" y="677" class="sans body">report · code · verdicts · lineage · receipt</text>
  </g>
  <path d="M859 524V550Q859 562 871 562H1209Q1221 562 1221 574V585" class="flow"/>

  <!-- Feedback first enters learning; only approved changes reach system controls -->
  <path d="M1376 630H1400Q1412 630 1412 618V548Q1412 536 1400 536H1209V524" class="learn"/>
  <text x="1397" y="589" text-anchor="end" class="sans small" fill="#d8b4fe">expert correction</text>
  <rect x="392" y="747" width="656" height="32" rx="16" fill="#211d3a" stroke="#6d5b98"/>
  <text x="720" y="767" text-anchor="middle" class="sans small" fill="#d8b4fe">approved versioned change bus · workflow / planner / compiler rule / contract</text>
  <path d="M1209 524V735Q1209 763 1181 763H1048" class="learn"/>
  <path d="M480 747V548Q480 536 468 536H207V524" class="learn"/>
  <path d="M720 747V548Q720 536 708 536H533V524" class="learn"/>
  <path d="M960 747V548Q960 536 948 536H859V524" class="learn"/>
  <text x="1190" y="743" text-anchor="end" class="sans small" fill="#d8b4fe">full regression + human approval</text>

  <!-- Legend and guarantee -->
  <g class="sans">
    <line x1="64" y1="842" x2="108" y2="842" stroke="#38bdf8" stroke-width="2.5"/>
    <text x="118" y="847" class="small">control + evidence flow</text>
    <line x1="330" y1="842" x2="374" y2="842" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="7 6"/>
    <text x="384" y="847" class="small">permissioned data access</text>
    <line x1="610" y1="842" x2="654" y2="842" stroke="#c084fc" stroke-width="2.3"/>
    <text x="664" y="847" class="small">benchmark-gated learning</text>
    <text x="1376" y="847" text-anchor="end" class="mono" font-size="12" fill="#64748b">FAIL CLOSED · TRACE EVERYTHING · CLAIM ONLY WHAT THE DESIGN SUPPORTS</text>
  </g>
</svg>
