<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650" role="img" aria-labelledby="title desc">
  <title id="title">Quantifact evidence compilation pipeline</title>
  <desc id="desc">An investment question becomes a typed plan, parallel generated functions, verified execution, and a reviewable evidence package.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#111b33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#020617" flood-opacity=".35"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#64748b"/>
    </marker>
    <style>
      .sans{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace}
      .label{font-size:13px;letter-spacing:1.8px;fill:#94a3b8;font-weight:650}
      .title{font-size:22px;fill:#f8fafc;font-weight:700}
      .copy{font-size:14px;fill:#aebbd0}
      .node{fill:#111c32;stroke:#334155;stroke-width:1.5}
      .node-strong{fill:#10243a;stroke:url(#accent);stroke-width:2}
      .chip{fill:#17233a;stroke:#334155}
    </style>
  </defs>
  <rect width="1400" height="650" rx="28" fill="url(#bg)"/>
  <circle cx="1270" cy="-40" r="260" fill="#2563eb" opacity=".08"/>
  <circle cx="120" cy="690" r="260" fill="#14b8a6" opacity=".06"/>

  <text x="64" y="66" class="sans label">QUANTIFACT · EVIDENCE COMPILER</text>
  <text x="64" y="106" class="sans title">From an ambiguous question to evidence a reviewer can reproduce</text>

  <g filter="url(#shadow)">
    <rect x="64" y="164" width="220" height="150" rx="16" class="node"/>
    <text x="88" y="199" class="sans label">01 · QUESTION</text>
    <text x="88" y="240" class="sans title">Clarify intent</text>
    <text x="88" y="271" class="sans copy">definition · universe</text>
    <text x="88" y="294" class="sans copy">horizon · knowledge date</text>

    <rect x="334" y="144" width="260" height="190" rx="16" class="node-strong"/>
    <text x="360" y="179" class="sans label">02 · TYPED PLAN / IR</text>
    <text x="360" y="220" class="sans title">Specify the evidence</text>
    <text x="360" y="251" class="sans copy">schemas · units · row grain</text>
    <text x="360" y="274" class="sans copy">dependencies · invariants</text>
    <rect x="360" y="295" width="204" height="24" rx="12" class="chip"/>
    <text x="462" y="312" text-anchor="middle" class="mono" font-size="11" fill="#5eead4">compile errors fail early</text>

    <rect x="644" y="125" width="250" height="228" rx="16" class="node"/>
    <text x="670" y="160" class="sans label">03 · PARALLEL CODEGEN</text>
    <text x="670" y="201" class="sans title">One function per task</text>
    <rect x="670" y="226" width="198" height="30" rx="7" class="chip"/>
    <text x="684" y="246" class="mono" font-size="11" fill="#cbd5e1">task_1(inputs) → frame</text>
    <rect x="670" y="265" width="198" height="30" rx="7" class="chip"/>
    <text x="684" y="285" class="mono" font-size="11" fill="#cbd5e1">task_2(inputs) → frame</text>
    <rect x="670" y="304" width="198" height="30" rx="7" class="chip"/>
    <text x="684" y="324" class="mono" font-size="11" fill="#cbd5e1">task_n(inputs) → frame</text>

    <rect x="944" y="144" width="392" height="190" rx="16" class="node-strong"/>
    <text x="970" y="179" class="sans label">04 · VERIFIED EXECUTION</text>
    <text x="970" y="220" class="sans title">The harness owns the run</text>
    <text x="970" y="251" class="sans copy">static DAG · point-in-time loaders · contracts</text>
    <text x="970" y="274" class="sans copy">targeted repair · content-addressed cache</text>
    <rect x="970" y="295" width="338" height="24" rx="12" class="chip"/>
    <text x="1139" y="312" text-anchor="middle" class="mono" font-size="11" fill="#60a5fa">failure is named; unverified output stops</text>
  </g>

  <g fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)">
    <path d="M284 239H326"/>
    <path d="M594 239H636"/>
    <path d="M894 239H936"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="334" y="410" width="1002" height="154" rx="18" fill="#0d172a" stroke="#334155" stroke-width="1.5"/>
    <text x="360" y="447" class="sans label">05 · REVIEWABLE EVIDENCE PACKAGE</text>
    <text x="360" y="491" class="sans title">Answer + report + receipt</text>
    <g class="sans" font-size="14" fill="#cbd5e1">
      <text x="360" y="528">✓ assumptions</text>
      <text x="515" y="528">✓ code</text>
      <text x="620" y="528">✓ checks</text>
      <text x="735" y="528">✓ repairs</text>
      <text x="855" y="528">✓ provenance</text>
      <text x="1005" y="528">✓ reproducible outputs</text>
    </g>
  </g>
  <path d="M1140 342V388Q1140 398 1130 398H835V410" fill="none" stroke="url(#accent)" stroke-width="2.5" marker-end="url(#arrow)"/>

  <text x="64" y="615" class="mono" font-size="12" fill="#64748b">QUESTION → SPECIFICATION → CODE → CHECKED VALUES → DECISION-GRADE EVIDENCE</text>
</svg>
