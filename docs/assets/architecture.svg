<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920" role="img" aria-labelledby="title desc">
  <title id="title">Quantifact investment research system architecture</title>
  <desc id="desc">System engineering view of Quantifact. External experts and model providers connect through explicit interfaces. Inside the system boundary, research understanding, analysis compiler, and controlled execution form the online evidence path. Shared model, point-in-time data, execution, cache, and evidence services support that path. Organisation learning is an offline governance subsystem that consumes feedback and traces, then publishes only human-approved versioned changes.</desc>
  <defs>
    <filter id="shadow" x="-12%" y="-18%" width="124%" height="145%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0f172a" flood-opacity=".07"/>
    </filter>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#7c3aed"/>
    </marker>
    <style>
      .sans{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace}
      .kicker{font-size:12px;letter-spacing:1.55px;font-weight:700;fill:#64748b}
      .title{font-size:27px;font-weight:760;fill:#0f172a}
      .subtitle{font-size:14px;fill:#475569}
      .card-title{font-size:20px;font-weight:750;fill:#0f172a}
      .body{font-size:13px;fill:#475569}
      .small{font-size:11px;fill:#64748b}
      .card{fill:#ffffff;stroke:#cbd5e1;stroke-width:1.35}
      .card-blue{fill:#f8fbff;stroke:#60a5fa;stroke-width:1.55}
      .card-green{fill:#f6fdf9;stroke:#5eead4;stroke-width:1.55}
      .card-violet{fill:#faf8ff;stroke:#a78bfa;stroke-width:1.55}
      .service{fill:#ffffff;stroke:#d8e0ea;stroke-width:1.2}
      .chip{fill:#f1f5f9;stroke:#dbe3ed;stroke-width:1}
      .flow{fill:none;stroke:#2563eb;stroke-width:2.35;marker-end:url(#arrow-blue)}
      .dependency{fill:none;stroke:#94a3b8;stroke-width:1.65;stroke-dasharray:5 5;marker-end:url(#arrow-grey)}
      .learn{fill:none;stroke:#7c3aed;stroke-width:2.1;marker-end:url(#arrow-violet)}
    </style>
  </defs>

  <rect width="1440" height="920" rx="24" fill="#f8fafc"/>
  <rect width="1440" height="7" rx="4" fill="#2563eb"/>

  <!-- Document title -->
  <text x="56" y="46" class="sans kicker">QUANTIFACT</text>
  <text x="56" y="80" class="sans title">Investment Research System Architecture</text>
  <text x="56" y="105" class="sans subtitle">Evidence compilation · controlled execution · governed organisational learning</text>

  <!-- External actors and services -->
  <text x="56" y="144" class="sans kicker">EXTERNAL</text>
  <g filter="url(#shadow)">
    <rect x="56" y="159" width="296" height="74" rx="12" class="card"/>
    <text x="78" y="187" class="sans kicker">RESEARCH EXPERT</text>
    <text x="78" y="212" class="sans body">question · plan review · evidence review · approval</text>

    <rect x="360" y="159" width="330" height="74" rx="12" class="card"/>
    <text x="382" y="187" class="sans kicker">MODEL PROVIDER</text>
    <text x="382" y="212" class="sans body">planning · code generation · optional critique</text>
  </g>

  <!-- System boundary -->
  <rect x="32" y="260" width="1376" height="594" rx="20" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.4"/>
  <rect x="32" y="260" width="1376" height="42" rx="20" fill="#e7edf5"/>
  <rect x="32" y="282" width="1376" height="20" fill="#e7edf5"/>
  <text x="56" y="287" class="sans kicker">QUANTIFACT SYSTEM BOUNDARY</text>
  <text x="1380" y="287" text-anchor="end" class="mono" font-size="10" fill="#64748b">models cannot bypass orchestration, data policy, execution or release gates</text>

  <!-- Runtime plane -->
  <text x="56" y="332" class="sans kicker">ONLINE RUNTIME PLANE</text>
  <g filter="url(#shadow)">
    <rect x="56" y="349" width="278" height="205" rx="14" class="card-blue"/>
    <text x="78" y="378" class="sans kicker">01 · RESEARCH UNDERSTANDING</text>
    <text x="78" y="410" class="sans card-title">Define admissible research</text>
    <text x="78" y="438" class="sans body">Clarify definitions, horizon and as_of</text>
    <text x="78" y="461" class="sans body">Retrieve permitted context and data</text>
    <text x="78" y="484" class="sans body">Bind claims, rivals and falsifiers</text>
    <rect x="78" y="505" width="234" height="29" rx="7" fill="#e8f1ff"/>
    <text x="195" y="524" text-anchor="middle" class="mono" font-size="10" fill="#1d4ed8">ResearchDesign + AnalysisPlan</text>

    <rect x="374" y="349" width="278" height="205" rx="14" class="card"/>
    <text x="396" y="378" class="sans kicker">02 · ANALYSIS COMPILER</text>
    <text x="396" y="410" class="sans card-title">Constrain implementation</text>
    <text x="396" y="438" class="sans body">Compile typed plan / IR</text>
    <text x="396" y="461" class="sans body">Generate task functions in parallel</text>
    <text x="396" y="484" class="sans body">Inspect AST and derive actual DAG</text>
    <rect x="396" y="505" width="234" height="29" rx="7" class="chip"/>
    <text x="513" y="524" text-anchor="middle" class="mono" font-size="10" fill="#334155">CheckedFunctions + DependencyDAG</text>

    <rect x="692" y="349" width="278" height="205" rx="14" class="card-blue"/>
    <text x="714" y="378" class="sans kicker">03 · CONTROLLED EXECUTION</text>
    <text x="714" y="410" class="sans card-title">Materialise verified values</text>
    <text x="714" y="438" class="sans body">Execute through PIT-bound loaders</text>
    <text x="714" y="461" class="sans body">Enforce contracts and reasoning gates</text>
    <text x="714" y="484" class="sans body">Cache, targeted repair, self-review</text>
    <rect x="714" y="505" width="234" height="29" rx="7" fill="#e8f1ff"/>
    <text x="831" y="524" text-anchor="middle" class="mono" font-size="10" fill="#1d4ed8">VerifiedRun | NamedFailure</text>

    <rect x="1010" y="349" width="374" height="205" rx="14" class="card-green"/>
    <text x="1032" y="378" class="sans kicker">EVIDENCE PRODUCT</text>
    <text x="1032" y="410" class="sans card-title">Reviewable evidence package</text>
    <text x="1032" y="438" class="sans body">Report · derived data · source code</text>
    <text x="1032" y="461" class="sans body">Verdicts · lineage · fingerprints · receipt</text>
    <text x="1032" y="484" class="sans body">Assumptions · rival explanations · limits</text>
    <rect x="1032" y="505" width="330" height="29" rx="7" fill="#e5f8f1"/>
    <text x="1197" y="524" text-anchor="middle" class="mono" font-size="10" fill="#0f766e">decision support · never an autonomous trade</text>
  </g>

  <!-- Typed interfaces: one unambiguous success path -->
  <path d="M334 452H366" class="flow"/>
  <path d="M652 452H684" class="flow"/>
  <path d="M970 452H1002" class="flow"/>

  <!-- Shared platform plane -->
  <text x="56" y="593" class="sans kicker">SHARED CONTROL + PLATFORM PLANE</text>
  <g filter="url(#shadow)">
    <rect x="56" y="610" width="286" height="91" rx="12" class="service"/>
    <text x="78" y="638" class="sans kicker">PIT DATA + RETRIEVAL</text>
    <text x="78" y="664" class="sans body">catalog · vintages · citations · entitlements</text>
    <text x="78" y="684" class="sans small">Adapters are the data trust boundary</text>

    <rect x="360" y="610" width="330" height="91" rx="12" class="service"/>
    <text x="382" y="638" class="sans kicker">MODEL GATEWAY</text>
    <text x="382" y="664" class="sans body">typed provider interface · retries · traces</text>
    <text x="382" y="684" class="sans small">No terminal, data or orchestration authority</text>

    <rect x="708" y="610" width="330" height="91" rx="12" class="service"/>
    <text x="730" y="638" class="sans kicker">EXECUTION + CACHE</text>
    <text x="730" y="664" class="sans body">harness · isolation boundary · value cache</text>
    <text x="730" y="684" class="sans small">System invokes code; the model does not</text>

    <rect x="1056" y="610" width="328" height="91" rx="12" class="service"/>
    <text x="1078" y="638" class="sans kicker">EVIDENCE + OBSERVABILITY STORE</text>
    <text x="1078" y="664" class="sans body">plans · code · verdicts · traces · artefacts</text>
    <text x="1078" y="684" class="sans small">Reproducible inputs for audit and learning</text>
  </g>

  <!-- Explicit service dependencies, no crossing lines -->
  <path d="M195 610V562" class="dependency"/>
  <path d="M513 610V562" class="dependency"/>
  <path d="M831 610V562" class="dependency"/>
  <path d="M1197 610V562" class="dependency"/>

  <!-- Governance plane -->
  <text x="56" y="740" class="sans kicker">OFFLINE GOVERNANCE PLANE</text>
  <g filter="url(#shadow)">
    <rect x="56" y="757" width="1328" height="72" rx="13" class="card-violet"/>
    <text x="78" y="785" class="sans kicker">04 · ORGANISATION LEARNING</text>
    <text x="78" y="811" class="sans body">feedback + traces</text>
    <text x="246" y="811" class="sans body">→ reproduce failure</text>
    <text x="418" y="811" class="sans body">→ benchmark</text>
    <text x="530" y="811" class="sans body">→ context / harness change</text>
    <text x="742" y="811" class="sans body">→ full regression</text>
    <text x="884" y="811" class="sans body">→ human approval</text>
    <rect x="1042" y="775" width="320" height="36" rx="9" fill="#ede9fe"/>
    <text x="1202" y="791" text-anchor="middle" class="mono" font-size="10" fill="#6d28d9">APPROVED RELEASE ARTEFACTS</text>
    <text x="1202" y="804" text-anchor="middle" class="mono" font-size="9" fill="#6d28d9">context · policy · benchmarks · next version</text>
  </g>

  <!-- Governed lifecycle edges -->
  <path d="M1197 701V749" class="learn"/>
  <text x="1211" y="730" class="sans small" fill="#6d28d9">audited traces</text>

  <!-- External interfaces -->
  <path d="M300 233V341" class="flow"/>
  <text x="525" y="247" text-anchor="middle" class="sans small">accessed only through Model Gateway</text>

  <!-- Legend -->
  <g class="sans">
    <line x1="56" y1="884" x2="94" y2="884" stroke="#2563eb" stroke-width="2.35"/>
    <text x="104" y="889" class="small">typed control / evidence interface</text>
    <line x1="330" y1="884" x2="368" y2="884" stroke="#94a3b8" stroke-width="1.65" stroke-dasharray="5 5"/>
    <text x="378" y="889" class="small">service dependency</text>
    <line x1="548" y1="884" x2="586" y2="884" stroke="#7c3aed" stroke-width="2.1"/>
    <text x="596" y="889" class="small">governed lifecycle</text>
    <text x="1384" y="889" text-anchor="end" class="mono" font-size="10" fill="#64748b">FAIL CLOSED · TRACE EVERYTHING · CLAIM ONLY WHAT THE DESIGN SUPPORTS</text>
  </g>
</svg>
